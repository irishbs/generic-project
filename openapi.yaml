openapi: 3.0.3
info:
  title: GenericProject Auth API
  version: 0.1.0
  description: Register, log in, log out, and check the current user. Sessions are JWTs in an httpOnly cookie named `session`.
servers:
  # Relative URL: "Try it out" calls the same server that serves the docs, on any port.
  - url: /
paths:
  /api/auth/register:
    post:
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid email, weak password, or malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/login:
    post:
      summary: Log in and receive a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in. The response sets the session cookie.
          headers:
            Set-Cookie:
              description: "session=<jwt>; HttpOnly; SameSite=Strict; Max-Age=3600"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Email or password missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong password or unknown email (same response for both)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      summary: Log out and revoke the current session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Logged out. The session cookie is cleared.
        "401":
          description: No session, invalid session, or already logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/me:
    get:
      summary: Get the logged-in user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: No session, invalid session, or logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: alice@example.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: At least 8 characters, with a letter and a number, at most 72 bytes.
          example: Passw0rd!
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid email or password
